<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="beacon mesh topology diagram">
  <title>beacon mesh topology — 3 servers, 1 agent, console, client</title>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" rx="12" fill="#f8fafc"/>
  <text x="30" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">beacon mesh topology</text>
  <text x="30" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">3 beacon-servers + 1 agent + console + client · live view: console MeshTopology (d3, health-colored nodes)</text>

  <!-- ===== servers ===== -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- server-1 leader -->
    <rect x="40" y="80" width="260" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="62" cy="102" r="8" fill="#16a34a"/>
    <text x="78" y="107" font-size="15" font-weight="700" fill="#0f172a">server-1 ★ leader (CP)</text>
    <text x="60" y="128" font-size="12" fill="#475569">:8500 HTTP · :8600 DNS · :8502 gRPC</text>
    <rect x="60" y="138" width="110" height="22" rx="11" fill="#16a34a"/>
    <text x="72" y="153" font-size="11" font-weight="600" fill="#ffffff">payments-1 ✓</text>
    <rect x="178" y="138" width="102" height="22" rx="11" fill="#16a34a"/>
    <text x="190" y="153" font-size="11" font-weight="600" fill="#ffffff">web-1 ✓</text>
    <rect x="60" y="166" width="110" height="22" rx="11" fill="#16a34a"/>
    <text x="72" y="181" font-size="11" font-weight="600" fill="#ffffff">api-1 ✓</text>

    <!-- server-2 follower, one critical instance -->
    <rect x="350" y="80" width="260" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="372" cy="102" r="8" fill="#16a34a"/>
    <text x="388" y="107" font-size="15" font-weight="700" fill="#0f172a">server-2 follower</text>
    <text x="370" y="128" font-size="12" fill="#475569">:8500 HTTP · :8600 DNS · :8502 gRPC</text>
    <rect x="370" y="138" width="110" height="22" rx="11" fill="#f31260"/>
    <text x="382" y="153" font-size="11" font-weight="600" fill="#ffffff">payments-2 ✗</text>
    <rect x="488" y="138" width="102" height="22" rx="11" fill="#16a34a"/>
    <text x="500" y="153" font-size="11" font-weight="600" fill="#ffffff">web-2 ✓</text>
    <rect x="370" y="166" width="110" height="22" rx="11" fill="#f5a524"/>
    <text x="382" y="181" font-size="11" font-weight="600" fill="#ffffff">api-2 flap</text>

    <!-- server-3 follower -->
    <rect x="660" y="80" width="260" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="682" cy="102" r="8" fill="#16a34a"/>
    <text x="698" y="107" font-size="15" font-weight="700" fill="#0f172a">server-3 follower</text>
    <text x="680" y="128" font-size="12" fill="#475569">:8500 HTTP · :8600 DNS · :8502 gRPC</text>
    <rect x="680" y="138" width="110" height="22" rx="11" fill="#16a34a"/>
    <text x="692" y="153" font-size="11" font-weight="600" fill="#ffffff">payments-3 ✓</text>
    <rect x="798" y="138" width="102" height="22" rx="11" fill="#16a34a"/>
    <text x="810" y="153" font-size="11" font-weight="600" fill="#ffffff">db-1 ✓</text>
    <rect x="680" y="166" width="110" height="22" rx="11" fill="#16a34a"/>
    <text x="692" y="181" font-size="11" font-weight="600" fill="#ffffff">api-3 ✓</text>
  </g>

  <!-- ===== inter-server edges ===== -->
  <!-- CP Raft: solid amber, leader -> followers (upper, slight bow) -->
  <path d="M 300 130 C 320 130, 330 130, 348 130" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <path d="M 300 155 C 420 60, 540 60, 658 130" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="430" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b45309">CP Raft (quorum writes, solid)</text>
  <!-- AP gossip: dashed green full mesh (lower bows) -->
  <path d="M 220 198 C 260 250, 310 250, 350 205" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M 530 198 C 570 250, 620 250, 660 205" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M 150 198 C 300 300, 660 300, 810 198" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-green)"/>
  <text x="352" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#16a34a">AP gossip — SWIM + catalog deltas, node fail → critical ~2s (dashed)</text>

  <!-- ===== bottom row: agent, console, client ===== -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="330" width="260" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="62" cy="352" r="8" fill="#0284c7"/>
    <text x="78" y="357" font-size="15" font-weight="700" fill="#0f172a">beacon-agent</text>
    <text x="60" y="380" font-size="12" fill="#475569">local state authoritative</text>
    <text x="60" y="398" font-size="12" fill="#475569">health checks over loopback</text>
    <text x="60" y="416" font-size="12" fill="#475569">SWIM membership · anti-entropy</text>

    <rect x="350" y="330" width="260" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="372" cy="352" r="8" fill="#7c3aed"/>
    <text x="388" y="357" font-size="15" font-weight="700" fill="#0f172a">console :3000</text>
    <text x="370" y="380" font-size="12" fill="#475569">MeshTopology (d3 graph)</text>
    <text x="370" y="398" font-size="12" fill="#475569">PropagationTimeline (SSE)</text>
    <text x="370" y="416" font-size="12" fill="#475569">ConsistencyLab · HealthInspector</text>

    <rect x="660" y="330" width="260" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <circle cx="682" cy="352" r="8" fill="#ea580c"/>
    <text x="698" y="357" font-size="15" font-weight="700" fill="#0f172a">client (SDK)</text>
    <text x="680" y="380" font-size="12" fill="#475569">beacon:// resolver + balancer</text>
    <text x="680" y="398" font-size="12" fill="#475569">streaming watch · DNS · xDS EDS</text>
    <text x="680" y="416" font-size="12" fill="#475569">never-empty addresses</text>
  </g>

  <!-- agent -> servers: register / anti-entropy -->
  <path d="M 120 330 C 120 280, 140 250, 160 200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>
  <path d="M 220 330 C 230 280, 330 250, 420 200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>
  <text x="238" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">register / anti-entropy</text>
  <!-- console -> server-1: SSE -->
  <path d="M 430 330 C 400 280, 300 250, 240 200" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-slate)"/>
  <text x="238" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7c3aed">SSE /v1/events</text>
  <!-- client -> servers: watch / DNS -->
  <path d="M 740 330 C 740 280, 760 250, 780 200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="752" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb">watch · DNS · xDS</text>

  <!-- ===== legend ===== -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">
    <rect x="40" y="462" width="880" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="62" cy="484" r="7" fill="#16a34a"/><text x="74" y="488">passing</text>
    <circle cx="152" cy="484" r="7" fill="#f5a524"/><text x="164" y="488">warning / flapping</text>
    <circle cx="300" cy="484" r="7" fill="#f31260"/><text x="312" y="488">critical</text>
    <line x1="400" y1="484" x2="440" y2="484" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5"/><text x="448" y="488">AP gossip</text>
    <line x1="560" y1="484" x2="600" y2="484" stroke="#b45309" stroke-width="2.5"/><text x="608" y="488">CP Raft</text>
    <line x1="712" y1="484" x2="752" y2="484" stroke="#64748b" stroke-width="2"/><text x="760" y="488">register / SSE / watch</text>
    <text x="62" y="512">kill one instance → node goes critical via gossip (~2s). Agent-local checks run over loopback, never centrally.</text>
  </g>
</svg>
