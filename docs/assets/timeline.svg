<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="beacon propagation timeline diagram">
  <title>beacon propagation timeline — t0 crash to t4 client, fast vs slow path</title>
  <defs>
    <marker id="tl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="12" fill="#f8fafc"/>
  <text x="30" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">propagation timeline</text>
  <text x="30" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">t0 crash → t1 detect → t2 propagate → t3 notify → t4 client · live view: console PropagationTimeline</text>

  <!-- axis -->
  <line x1="60" y1="140" x2="910" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#tl-arr)"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <g>
      <circle cx="90" cy="140" r="10" fill="#f31260"/>
      <text x="90" y="118" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">t0</text>
      <text x="90" y="170" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">crash</text>
      <text x="90" y="186" font-size="11" fill="#64748b" text-anchor="middle">instance dies</text>
    </g>
    <g>
      <circle cx="290" cy="140" r="10" fill="#f5a524"/>
      <text x="290" y="118" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">t1</text>
      <text x="290" y="170" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">detect</text>
      <text x="290" y="186" font-size="11" fill="#64748b" text-anchor="middle">~2s gossip SWIM</text>
      <text x="290" y="200" font-size="11" fill="#64748b" text-anchor="middle">~15s health check</text>
    </g>
    <g>
      <circle cx="490" cy="140" r="10" fill="#0284c7"/>
      <text x="490" y="118" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">t2</text>
      <text x="490" y="170" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">propagate</text>
      <text x="490" y="186" font-size="11" fill="#64748b" text-anchor="middle">gossip delta · index bump</text>
    </g>
    <g>
      <circle cx="690" cy="140" r="10" fill="#7c3aed"/>
      <text x="690" y="118" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">t3</text>
      <text x="690" y="170" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">notify</text>
      <text x="690" y="186" font-size="11" fill="#64748b" text-anchor="middle">watch fan-out / blocking / DNS</text>
    </g>
    <g>
      <circle cx="880" cy="140" r="10" fill="#16a34a"/>
      <text x="880" y="118" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">t4</text>
      <text x="880" y="170" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">client</text>
      <text x="880" y="186" font-size="11" fill="#64748b" text-anchor="middle">stops routing to dead</text>
    </g>
  </g>

  <!-- comparison bars -->
  <text x="30" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">fast vs slow path (p50, `beacon bench propagate`)</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12">
    <text x="30" y="266" fill="#334155">gossip + streaming (fast)</text>
    <rect x="240" y="250" width="40" height="20" rx="4" fill="#16a34a"/>
    <text x="288" y="265" fill="#0f172a" font-weight="700">2.011s</text>

    <text x="30" y="296" fill="#334155">health + streaming</text>
    <rect x="240" y="280" width="268" height="20" rx="4" fill="#f5a524"/>
    <text x="516" y="295" fill="#0f172a" font-weight="700">15.061s</text>

    <text x="30" y="326" fill="#334155">health + blocking</text>
    <rect x="240" y="310" width="313" height="20" rx="4" fill="#ea580c"/>
    <text x="561" y="325" fill="#0f172a" font-weight="700">17.56s</text>

    <text x="30" y="356" fill="#334155">health + DNS (slow)</text>
    <rect x="240" y="340" width="660" height="20" rx="4" fill="#f31260"/>
    <text x="908" y="355" fill="#0f172a" font-weight="700" text-anchor="end">45.15s</text>
  </g>

  <rect x="30" y="380" width="900" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">≈22× spread: fast path (gossip + streaming watch) vs slow path (health check + DNS TTL)</text>
  <text x="48" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">That spread is the engineering argument for gossip-driven propagation. Reproduce: `go run ./cmd/beacon bench propagate`</text>
</svg>
