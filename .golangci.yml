# golangci-lint configuration for beacon.
# Run: golangci-lint run ./...
version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gocritic
    - misspell
    - unused
    - importas
    - bodyclose
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam  # catalog.Instance is large but cloned at boundaries
issues:
  exclude-rules:
    # Virtual clock and sim helpers legitimately use time.Sleep for goroutine scheduling.
    - path: pkg/sim/
      linters:
        - govet
      text: "time.Sleep"
    # Test files may use bare timers for test infrastructure.
    - path: _test\.go
      linters:
        - errcheck
    - path: pkg/api/pb/pb.go
      linters:
        - revive
        - staticcheck
formatters:
  enable:
    - gofmt
    - goimports
