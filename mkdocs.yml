  - Health: HEALTH.md
  - Propagation: PROPAGATION.md
  - Watch: WATCH.md
  - xDS: XDS.md
  - Integration: INTEGRATION.md
  - Anti-Entropy: ANTI_ENTROPY.md
  - Event Schema: EVENT_SCHEMA.md
  - Console: CONSOLE.md
  - SLOs: SLO.md
  - Disaster Recovery: DISASTER-RECOVERY.md
  - Runbooks:
      - runbooks/RUNBOOK.md
      - runbooks/gossip-partition.md
      - runbooks/xds-nack.md
      - runbooks/flapping.md
  - ADRs:
      - adr/0001-ap-vs-cp.md
      - adr/0002-agent-local-health.md
      - adr/0003-monotonic-index.md
