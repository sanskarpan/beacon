global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: beacon-servers
    metrics_path: /metrics
    static_configs:
      - targets:
          - server-1:8500
          - server-2:8500
          - server-3:8500

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
