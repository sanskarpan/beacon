apiVersion: v1
kind: Namespace
metadata: { name: beacon }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: beacon-server, namespace: beacon }
spec:
  serviceName: beacon-server
  replicas: 3
  selector: { matchLabels: { app: beacon-server } }
  template:
    metadata: { labels: { app: beacon-server } }
    spec:
      containers:
        - name: server
          image: ghcr.io/sanskarpan/beacon:latest
          args: ["./bin/beacon-server", "--http", ":8500", "--dns", ":8600", "--grpc", ":8502", "--consistency", "ap"]
          ports: [{ containerPort: 8500 }, { containerPort: 8600 }, { containerPort: 8502 }]
          livenessProbe: { httpGet: { path: /health, port: 8500 }, initialDelaySeconds: 10, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready, port: 8500 }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: beacon-server, namespace: beacon }
spec:
  selector: { app: beacon-server }
  ports:
    - { name: http, port: 8500 }
    - { name: dns, port: 8600, protocol: UDP }
    - { name: grpc, port: 8502 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: beacon-server, namespace: beacon }
spec: { minAvailable: 2, selector: { matchLabels: { app: beacon-server } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: beacon-server, namespace: beacon }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: StatefulSet, name: beacon-server }
  minReplicas: 3
  maxReplicas: 7
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: beacon-server, namespace: beacon }
spec:
  podSelector: { matchLabels: { app: beacon-server } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8500 }, { port: 8502 }, { port: 8600 }]
