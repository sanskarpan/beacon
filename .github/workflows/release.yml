name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.27", cache: true }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: console
      - run: bun run build
        working-directory: console
      - name: Install syft (GoReleaser SBOM cataloging)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Log in to GHCR (GoReleaser Docker push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with: { version: latest, args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io
      - uses: anchore/sbom-action@v0
        with: { path: ./, format: spdx-json, output-file: sbom.spdx.json }
      - uses: sigstore/cosign-installer@v3
      # GoReleaser's .Version strips the leading `v`, so the pushed tags are
      # `:0.1.0`-style, not `:v0.1.0` (github.ref_name). Sign what was pushed.
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cosign sign --yes "ghcr.io/${{ github.repository }}:${VERSION}" "ghcr.io/${{ github.repository }}:latest"
        env: { COSIGN_EXPERIMENTAL: "1" }
