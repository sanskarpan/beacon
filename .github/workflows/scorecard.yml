name: scorecard
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 8 * * 1" }]
permissions: { security-events: write, id-token: write, contents: read, actions: read }
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@v2.4.2
        # publish_results disabled: the public API endpoint flakes behind
        # retries and fails the run; SARIF upload below still surfaces
        # findings in the Security tab on every push.
        with: { results_file: results.sarif, results_format: sarif, publish_results: false }
      - uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: results.sarif }
