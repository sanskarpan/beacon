name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only at top level (Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=5m
      - name: vulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: test
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: test race (critical packages)
        run: go test -race -count=1 ./pkg/catalog ./pkg/health ./pkg/agent ./pkg/gossip ./pkg/store/raft/consensus ./pkg/xds ./pkg/mesh ./pkg/sdk ./pkg/watch
      - name: upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: build
        run: |
          go build -o bin/beacon ./cmd/beacon
          go build -o bin/beacon-server ./cmd/beacon-server
          go build -o bin/beacon-agent ./cmd/beacon-agent
          go build -o bin/demo ./examples/demo
      - name: sim
        run: go run ./cmd/beacon sim flap
      - name: bench gate (non-blocking)
        run: go test -run TestCIConvergenceGate -count=1 ./... || true
      - name: forbid paths
        run: |
          if grep -r "pkg/api/pb" --include="*.go" pkg | grep -v -E "pkg/api/pb/|pkg/api/grpcapi/proto_server(_test)?\.go" | grep -q .; then echo "forbidden import"; exit 1; fi

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint 2>&1 | head -50 || echo "no lint script"
      - run: bun run typecheck 2>&1 | head -50 || bunx tsc --noEmit 2>&1 | head -50 || true
      - run: bun run build
      - run: bun run test 2>&1 | head -50 || echo "no tests"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          tags: beacon:ci
