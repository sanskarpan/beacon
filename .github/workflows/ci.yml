name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: test race
        run: go test -race ./pkg/catalog/ ./pkg/health/ ./pkg/lb/ ./pkg/watch/
      - name: build
        run: |
          go build -o bin/beacon ./cmd/beacon
          go build -o bin/beacon-server ./cmd/beacon-server
          go build -o bin/beacon-agent ./cmd/beacon-agent
      - name: sim
        run: go run ./cmd/beacon sim flap

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./...

  forbid-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check no generated pb in tree
        run: |
          if [ -d "pkg/api/pb" ] && [ "$(ls -A pkg/api/pb/*.go 2>/dev/null)" ]; then
            echo "ERROR: pkg/api/pb/*.go found — should not be committed (generated)."
            echo "Run 'make proto' locally instead."
            exit 1
          fi
          echo "OK: no generated pb files in tree"

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
